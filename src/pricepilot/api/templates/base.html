<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PricePilot{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>PricePilot</a>
      <nav aria-label="Main">
        <a href="/" {% if page == "products" %}aria-current="page"{% endif %}>Products</a>
        <a href="/status" {% if page == "status" %}aria-current="page"{% endif %}>Pipeline status</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    Competitor prices are real. Our catalogue, sales volumes and price history are simulated.
    <a href="/status">What is real and what is not</a>.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
