services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pricepilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricepilot}
      POSTGRES_DB: ${POSTGRES_DB:-pricepilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pricepilot} -d ${POSTGRES_DB:-pricepilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricepilot-api
    command: uvicorn pricepilot.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pricepilot}:${POSTGRES_PASSWORD:-pricepilot}@db:5432/${POSTGRES_DB:-pricepilot}
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricepilot-mock-store
    command: uvicorn services.mock_store.app:app --host 0.0.0.0 --port 8001
    ports:
      - "${MOCK_STORE_PORT:-8001}:8001"

volumes:
  pgdata:
