[project]
name = "pricepilot"
version = "0.1.0"
description = "Competitive pricing intelligence: scrape competitor prices, match listings to our catalogue, recommend prices with a hard margin floor."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.0.1",
    "anthropic>=1.8.0",
    "pg8000>=1.31.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepilot"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "services", "scripts", "tests"]
# Kaggle notebooks run remotely as pasted scripts (notebook-style imports mid-file, long lines);
# their contract is pinned by the parity tests in tests/, not by the linter.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter

# CLAUDE.md §9: "An LLM call outside src/llm/client.py" must never happen.
# A rule in a markdown file is a suggestion; this makes CI fail instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "LLM SDKs may only be imported inside src/pricepilot/llm/client.py (CLAUDE.md §5.4)."
"openai".msg = "LLM SDKs may only be imported inside src/pricepilot/llm/client.py (CLAUDE.md §5.4)."

[tool.ruff.lint.per-file-ignores]
"src/pricepilot/llm/client.py" = ["TID251"]
"alembic/versions/*" = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "services", "scripts"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "selectolax.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_db: test needs a live Postgres (skipped when DATABASE_URL is unreachable)",
]
asyncio_mode = "auto"
